<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail - FOoTLAB</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --black: #111;
      --off-white: #f8f8f8;
      --border: #e0e0e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      color: #333;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .navbar.scrolled {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .navbar-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 4px;
      color: var(--black) !important;
    }

    .navbar-brand span {
      color: #888;
    }

    .nav-link {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #333 !important;
      padding: 8px 16px !important;
    }

    .nav-link:hover {
      color: var(--black) !important;
    }

    .dropdown-menu {
      border: 1px solid var(--border);
      border-radius: 0;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      padding: 8px 0;
    }

    .dropdown-item {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 20px;
      color: #333;
      transition: all 0.2s;
    }

    .dropdown-item:hover {
      background: var(--off-white);
      color: var(--black);
      padding-left: 28px;
    }

    .page-wrap {
      padding-top: 80px;
    }

    /* Breadcrumb */
    .breadcrumb-bar {
      background: var(--off-white);
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .breadcrumb {
      margin: 0;
    }

    .breadcrumb-item a {
      font-size: 11px;
      color: #999;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .breadcrumb-item.active {
      font-size: 11px;
      color: #555;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .breadcrumb-item+.breadcrumb-item::before {
      color: #ccc;
    }

    /* Product Section */
    .product-section {
      padding: 60px 0 100px;
    }

    /* Image Area */
    .product-main-img-wrap {
      position: relative;
      background: var(--off-white);
      border: 1px solid var(--border);
      aspect-ratio: 4/3;
      overflow: hidden;
    }

    .product-main-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }

    .product-main-img-wrap:hover img {
      transform: scale(1.03);
    }

    .img-change-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      text-align: center;
      padding: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .product-main-img-wrap:hover .img-change-overlay {
      opacity: 1;
    }

    .hidden-input {
      display: none;
    }

    .product-badge-lg {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 7px 16px;
      background: var(--black);
      color: white;
    }

    /* Product Info */
    .product-brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .product-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 4vw, 52px);
      letter-spacing: 1px;
      line-height: 1;
      color: var(--black);
      margin-bottom: 16px;
    }

    .product-cat-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 16px;
      border: 1.5px solid var(--border);
      color: #666;
      margin-bottom: 24px;
    }

    .product-price-big {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 2px;
      color: var(--black);
      margin-bottom: 24px;
    }

    .product-desc {
      font-size: 13px;
      line-height: 1.9;
      color: #666;
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    /* Specs Table */
    .specs-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 16px;
    }

    .spec-row {
      display: flex;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--off-white);
      font-size: 12px;
    }

    .spec-key {
      width: 140px;
      flex-shrink: 0;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #999;
      font-size: 10px;
    }

    .spec-val {
      color: var(--black);
      font-weight: 600;
    }

    /* Actions */
    .action-btns {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn-enquire {
      flex: 1;
      padding: 16px;
      background: var(--black);
      color: white;
      border: 2px solid var(--black);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-enquire:hover {
      background: #444;
    }

    .btn-whatsapp {
      padding: 16px 24px;
      background: #25D366;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .btn-whatsapp:hover {
      background: #1ebe5d;
      color: white;
    }

    /* Related */
    .related-section {
      padding: 60px 0;
      background: var(--off-white);
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 1px;
      color: var(--black);
    }

    .section-line {
      width: 48px;
      height: 2px;
      background: var(--black);
      margin: 16px 0 40px;
    }

    .product-card {
      border: 1px solid var(--border);
      background: #fff;
      overflow: hidden;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }

    .product-card:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
      transform: translateY(-4px);
    }

    .product-img-sm {
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--off-white);
    }

    .product-img-sm img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }

    .product-card:hover .product-img-sm img {
      transform: scale(1.04);
    }

    .product-card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .pc-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 4px;
    }

    .pc-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--black);
      margin-bottom: auto;
    }

    .pc-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--black);
      margin-top: 10px;
    }

    footer {
      background: #0a0a0a;
      color: rgba(255, 255, 255, 0.5);
      padding: 60px 0 30px;
    }

    .footer-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 5px;
      color: white;
      margin-bottom: 12px;
    }

    .footer-copy {
      font-size: 11px;
    }

    .toast-notify {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--black);
      color: white;
      padding: 14px 24px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      z-index: 9999;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast-notify.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="../index.html">FOoT<span>LAB</span></a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Brands</a>
            <ul class="dropdown-menu" id="brandDropdown">
              <li><a class="dropdown-item" href="shop.html?brand=all">All Brands</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="compare.html">Compare</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-wrap">
    <!-- Breadcrumb -->
    <div class="breadcrumb-bar">
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="shop.html">Shop</a></li>
            <li class="breadcrumb-item active" id="bcProduct">Product</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- PRODUCT DETAIL -->
    <section class="product-section">
      <div class="container" id="productWrap">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- RELATED PRODUCTS -->
    <section class="related-section">
      <div class="container">
        <p class="section-label">You May Also Like</p>
        <h2 class="section-title">Related Products</h2>
        <div class="section-line"></div>
        <div class="row g-3" id="relatedGrid"></div>
      </div>
    </section>
  </div>

  <footer>
    <div class="container">
      <div class="row g-4 mb-4">
        <div class="col-lg-4">
          <div class="footer-brand">FOoTLAB</div>
          <p style="font-size:12px;color:rgba(255,255,255,0.4);">Pakistan's most trusted camera store.</p>
        </div>
        <div class="col-6 col-lg-2">
          <div
            style="font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:white;margin-bottom:16px;">
            Links</div>
          <a href="../index.html"
            style="display:block;font-size:12px;color:rgba(255,255,255,0.4);text-decoration:none;margin-bottom:10px;">Home</a>
          <a href="shop.html"
            style="display:block;font-size:12px;color:rgba(255,255,255,0.4);text-decoration:none;margin-bottom:10px;">Shop</a>
        </div>
      </div>
      <hr style="border-color:rgba(255,255,255,0.08);">
      <p class="footer-copy">© 2026 FOoTLAB. All Rights Reserved.</p>
    </div>
  </footer>

  <div class="toast-notify" id="toastNotify"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/compare.js"></script>
  <script>
    $(window).on('scroll', function () { if ($(this).scrollTop() > 50) $('#mainNav').addClass('scrolled'); else $('#mainNav').removeClass('scrolled'); });

    brands.forEach(b => { $('#brandDropdown').append(`<li><a class="dropdown-item" href="shop.html?brand=${b}">${b}</a></li>`); });

    const params = new URLSearchParams(window.location.search);
    const pid = parseInt(params.get('id'));
    const product = products.find(p => p.id === pid);

    if (!product) {
      $('#productWrap').html('<div class="text-center py-5"><h2 style="font-family:Bebas Neue,sans-serif;font-size:48px;color:#ccc;">Product Not Found</h2><a href="shop.html" class="btn-enquire d-inline-block mt-3" style="padding:14px 32px;background:#111;color:white;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">Back to Shop</a></div>');
    } else {
      document.title = product.name + ' - FOOTLAB';
      $('#bcProduct').text(product.name);

      const d = product.details;
      $('#productWrap').html(`
        <div class="row g-5">
          <div class="col-lg-6">
            <div class="product-main-img-wrap">
              <img src="${product.image}" alt="${product.name}" id="mainProductImg" onerror="this.src='https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400&q=80'">
              ${product.badge ? `<div class="product-badge-lg">${product.badge}</div>` : ''}
              <div class="img-change-overlay" onclick="document.getElementById('mainImgUpload').click()">
                <i class="fas fa-image me-2"></i>Change Image
              </div>
              <input type="file" accept="image/*" class="hidden-input" id="mainImgUpload" onchange="changeMainImg(this)">
            </div>
            <p style="font-size:11px;color:#bbb;margin-top:10px;text-align:center;letter-spacing:1px;">Hover on image to change it</p>
          </div>

          <div class="col-lg-6">
            <div class="product-brand-tag">
              <span>${product.brand}</span>
              <span style="color:#ddd;">|</span>
              <span>${product.category}</span>
            </div>
            <h1 class="product-title">${product.name}</h1>
            <div class="product-cat-pill">${product.category}</div>
            <div class="product-price-big">${product.price}</div>
            <p class="product-desc">${d.description}</p>

            ${d.sensor !== 'N/A' ? `
            <div class="specs-title">Specifications</div>
            <div class="spec-row"><div class="spec-key">Sensor</div><div class="spec-val">${d.sensor}</div></div>
            ${d.video !== 'N/A' ? `<div class="spec-row"><div class="spec-key">Video</div><div class="spec-val">${d.video}</div></div>` : ''}
            ${d.iso !== 'N/A' ? `<div class="spec-row"><div class="spec-key">ISO Range</div><div class="spec-val">${d.iso}</div></div>` : ''}
            ${d.fps !== 'N/A' ? `<div class="spec-row"><div class="spec-key">FPS</div><div class="spec-val">${d.fps}</div></div>` : ''}
            <div class="spec-row"><div class="spec-key">Autofocus</div><div class="spec-val">${d.af}</div></div>
            <div class="spec-row"><div class="spec-key">Stabilization</div><div class="spec-val">${d.stabilization}</div></div>
            <div class="spec-row"><div class="spec-key">Weight</div><div class="spec-val">${d.weight}</div></div>
            ` : ''}

            <div class="action-btns">
              <button class="btn-enquire" onclick="showToast('Enquiry sent! We will contact you soon.')">
                <i class="fas fa-envelope me-2"></i>Enquire Now
              </button>
              <a href="https://wa.me/923001234567?text=I am interested in ${encodeURIComponent(product.name)}" target="_blank" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i>
              </a>
            </div>

            <div style="margin-top:24px;padding-top:24px;border-top:1px solid #eee;display:flex;gap:24px;">
              <div style="text-align:center;">
                <i class="fas fa-shield-alt" style="font-size:20px;color:#ccc;margin-bottom:6px;display:block;"></i>
                <span style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#999;font-weight:600;">Genuine</span>
              </div>
              <div style="text-align:center;">
                <i class="fas fa-truck" style="font-size:20px;color:#ccc;margin-bottom:6px;display:block;"></i>
                <span style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#999;font-weight:600;">Fast Delivery</span>
              </div>
              <div style="text-align:center;">
                <i class="fas fa-undo" style="font-size:20px;color:#ccc;margin-bottom:6px;display:block;"></i>
                <span style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#999;font-weight:600;">7-Day Return</span>
              </div>
              <div style="text-align:center;">
                <i class="fas fa-headset" style="font-size:20px;color:#ccc;margin-bottom:6px;display:block;"></i>
                <span style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#999;font-weight:600;">Expert Help</span>
              </div>
            </div>
          </div>
        </div>
      `);

      // Related products (same brand or category, excluding current)
      const related = products.filter(p => p.id !== product.id && (p.brand === product.brand || p.category === product.category)).slice(0, 4);
      let relHtml = '';
      related.forEach(p => {
        relHtml += `
          <div class="col-6 col-md-3">
            <a href="product.html?id=${p.id}" class="product-card">
              <div class="product-img-sm"><img src="${p.image}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400&q=80'"></div>
              <div class="product-card-body">
                <div class="pc-brand">${p.brand}</div>
                <div class="pc-name">${p.name}</div>
                <div class="pc-price">${p.price}</div>
              </div>
            </a>
          </div>`;
      });
      $('#relatedGrid').html(relHtml);
    }

    function changeMainImg(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => { $('#mainProductImg').attr('src', e.target.result); showToast('Image changed!'); };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function showToast(msg) { $('#toastNotify').text(msg).addClass('show'); setTimeout(() => $('#toastNotify').removeClass('show'), 2800); }
  </script>
</body>

</html>
